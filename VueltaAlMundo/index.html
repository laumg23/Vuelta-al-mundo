<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Alicante a Nordkapp</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO -->
  <div id="controls">

    <div id="hero">
      <h1>De Alicante a Nordkapp</h1>
      <p>La vuelta a Europa en bicicleta</p>
    </div>

  </div>

  <!-- ESTADÍSTICAS -->
  <div id="stats">

    <div class="card">
      <span>RECORRIDO</span>
      <h2 id="km">0</h2>
      <small>KM</small>
    </div>

    <div class="card">
      <span>ETAPAS</span>
      <h2 id="days">0</h2>
      <small>DÍAS</small>
    </div>

    <div class="card">
      <span>DESNIVEL</span>
      <h2 id="elevation">0 m</h2>
    </div>

    <div class="status">
      EN RUTA
    </div>

  </div>

  <!-- PANEL DERECHO -->
  <div id="infoPanel">

    <div class="locationCard">
      <span class="green">● POSICIÓN ACTUAL</span>
      <h2 id="currentCountry">—</h2>
      <p id="currentPlace">Sin datos</p>
    </div>

    <div class="countriesCard">
      <div class="row">
        <span>Países visitados</span>
        <strong id="countryCount">0</strong>
      </div>
    </div>

    <button id="fitRoutes">
      VER MAPA COMPLETO
    </button>

  </div>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- PANEL DE ETAPAS -->
  <div id="stagePanel">

    <div class="panelHeader">
      <h3>ETAPAS</h3>
      <span id="stageCounter">0</span>
    </div>

    <div id="stageList"></div>

  </div>

  <!-- LIBRERÍAS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

  <!-- JS -->
  <script src="main.js"></script>

</body>
</html>
